    <path d="M34 44 C33 34 37 25 50 25 C63 25 67 34 66 44 C69 41 71 35 68 28 C64 21 58 19 50 19 C42 19 36 21 32 28 C29 35 31 41 34 44 Z" fill="#0f0e0d" />
    <path d="M32 32 C30 40 33 48 35 52 C34 48 33 42 35 36 Z" fill="#1c1917" />
    <path d="M68 32 C70 40 67 48 65 52 C66 48 67 42 65 36 Z" fill="#1c1917" />
